<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Печать</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 560px; height: 560px; box-sizing: border-box; background: {{ground}}; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif">
<svg width="380" height="380" viewBox="0 0 340 340" role="img" aria-label="Круглая печать Maple Lingua с кленовым листом">
<defs>
<path id="seal-ring" d="M170,170 m-124,0 a124,124 0 1,1 248,0 a124,124 0 1,1 -248,0"></path>
</defs>
<circle cx="170" cy="170" r="160" fill="none" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="170" cy="170" r="98" fill="none" stroke="#FFFFFF" stroke-width="1.5"></circle>
<text fill="#FFFFFF" font-family="Manrope, sans-serif" font-size="21" font-weight="800" letter-spacing="3">
<textPath href="#seal-ring" textLength="770" lengthAdjust="spacing">MAPLE LINGUA • FRANÇAIS • ENGLISH •</textPath>
</text>
<polygon transform="translate(105 109) scale(1.3)" fill="{{accent}}" points="50,5 57,20 64,16 61,36 74,24 77,31 90,28 85,42 92,46 73,62 76,70 54,67 55,90 45,90 46,67 24,70 27,62 8,46 15,42 10,28 23,31 26,24 39,36 36,16 43,20"></polygon>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#1B2A41","options":["#1B2A41","#1F4E9C","#C8332B"]},"accent":{"editor":"color","default":"#E5483E"},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#1B2A41', accent: this.props.accent ?? '#E5483E' };
}
}
</script>
</body>
</html>
